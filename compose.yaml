services:
  db:
    image: postgres:16.1
    container_name: postgres-shareit
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: "12345"
    volumes:
      - shareit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shareit_pgdata:
